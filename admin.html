<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel • Quotes NRY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0b0c14;
      --bg-1: #12132a;
      --pink: #f2a1b3;
      --pink-2: #d47aa0;
      --text: #ececf3;
      --muted: #a7a7c0;
      --glass-1: rgba(255,255,255,.08);
      --glass-2: rgba(255,255,255,.03);
      --border: rgba(255,182,193,.18);
      --border-2: rgba(255,255,255,.14);
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --green: #6ee7b7;
      --red: #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 12% -12%, rgba(242,161,179,.09), transparent 42%),
        radial-gradient(900px 520px at 88% 112%, rgba(242,161,179,.06), transparent 44%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-0) 100%);
      background-attachment: fixed;
    }

    /* ── HEADER ── */
    .siteHeader {
      position: sticky; top: 0; z-index: 999;
      background: linear-gradient(180deg, rgba(11,12,20,.92), rgba(11,12,20,.55));
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .headerWrap {
      max-width: 1200px; margin: 0 auto;
      height: 68px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .logoBlock { display: flex; flex-direction: column; line-height: 1.05; }
    .logoTitle { font-weight: 800; font-size: 16px; color: var(--pink); }
    .logoSub { font-size: 10px; letter-spacing: .28em; color: var(--muted); }
    .pill {
      text-decoration: none; color: var(--text); font-weight: 700;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      transition: .2s ease; font-size: 13px; cursor: pointer;
    }
    .pill:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .pill.danger { border-color: rgba(248,113,113,.3); color: var(--red); }

    /* ── LAYOUT ── */
    .adminWrap { max-width: 1200px; margin: 0 auto; padding: 24px 18px 60px; }

    /* ── CARD ── */
    .card {
      background: linear-gradient(180deg, var(--glass-1), var(--glass-2));
      border: 1px solid var(--border);
      border-radius: 22px; padding: 20px;
      box-shadow: var(--shadow); backdrop-filter: blur(14px);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text); font-weight: 700; font-size: 13px;
      cursor: pointer; transition: .2s ease; text-decoration: none; user-select: none;
      font-family: "Inter", sans-serif;
    }
    .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .btn.primary {
      border: none; color: #1b0b12;
      background: linear-gradient(135deg, var(--pink), var(--pink-2));
      box-shadow: 0 8px 24px rgba(242,161,179,.35);
    }
    .btn.primary:hover { box-shadow: 0 12px 32px rgba(242,161,179,.45); }
    .btn.danger { border-color: rgba(248,113,113,.3); color: var(--red); }
    .btn.danger:hover { background: rgba(248,113,113,.12); }
    .btn.success { border-color: rgba(110,231,183,.3); color: var(--green); }
    .btn.success:hover { background: rgba(110,231,183,.1); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── INPUTS ── */
    input, textarea, select {
      width: 100%; background: rgba(255,255,255,.05);
      border: 1px solid var(--border-2); border-radius: 14px;
      padding: 11px 14px; color: var(--text); outline: none; font-size: 14px;
      font-family: inherit;
    }
    input::placeholder, textarea::placeholder { color: rgba(167,167,192,.7); }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, textarea:focus { border-color: rgba(242,161,179,.4); }

    /* ── LOGIN ── */
    #loginSection { max-width: 420px; margin: 80px auto; }
    #loginSection h2 { font-family: "Playfair Display", serif; color: var(--pink); font-size: 28px; margin-bottom: 20px; }
    .formRow { display: flex; flex-direction: column; gap: 10px; }

    /* ── ADMIN GRID ── */
    .adminGrid { display: grid; gap: 18px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .adminGrid { grid-template-columns: 1fr 1fr; } }

    .adminSection {
      border-radius: 22px; border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: 0 10px 30px rgba(0,0,0,.28); backdrop-filter: blur(14px);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .adminSectionHead {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 14px 16px; flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.025);
    }
    .adminSectionHead h3 {
      font-family: "Playfair Display", serif; color: var(--pink);
      font-size: 17px; font-weight: 700;
    }
    .adminSectionBody { padding: 14px; }

    /* ── SCROLLBOX ── */
    .scrollBox {
      height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-right: 4px; scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.2) transparent;
    }
    .scrollBox::-webkit-scrollbar { width: 6px; }
    .scrollBox::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 99px; }

    /* ── FOLDER ITEMS ── */
    .folderItem {
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
      border-radius: 16px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .folderItemTop { display: flex; align-items: center; gap: 10px; }
    .folderIcon { font-size: 24px; flex-shrink: 0; }
    .folderName { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .folderMeta { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .folderActions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── TOGGLE SWITCH ── */
    .toggleWrap { display: flex; align-items: center; gap: 10px; }
    .toggleLabel { font-size: 13px; font-weight: 600; }
    .toggle {
      position: relative; width: 48px; height: 26px;
      background: rgba(255,255,255,.12); border-radius: 999px;
      border: 1px solid rgba(255,255,255,.2); cursor: pointer;
      transition: .3s ease;
    }
    .toggle.on { background: linear-gradient(135deg, var(--green), #34d399); border-color: transparent; }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; transition: .3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .toggle.on::after { left: 25px; }

    /* ── STATUS BADGE ── */
    .badge {
      padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      letter-spacing: .04em;
    }
    .badge.enabled { background: rgba(110,231,183,.15); color: var(--green); border: 1px solid rgba(110,231,183,.3); }
    .badge.disabled { background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.25); }

    /* ── STATS ROW ── */
    .statsRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 600px) { .statsRow { grid-template-columns: 1fr 1fr; } }
    .statCard {
      border-radius: 18px; padding: 14px 16px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
    }
    .statNum { font-size: 28px; font-weight: 800; color: var(--pink); }
    .statLabel { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }

    /* ── FILE GRID (images) ── */
    .fileGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .fileGridItem {
      position: relative; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.04);
      aspect-ratio: 1;
    }
    .fileGridItem img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .fileGridItemOverlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 55%);
      opacity: 0; transition: .2s ease;
      display: flex; align-items: flex-end; padding: 8px;
    }
    .fileGridItem:hover .fileGridItemOverlay { opacity: 1; }
    .fileGridItemName {
      font-size: 10px; color: #fff; font-weight: 600;
      word-break: break-all; line-height: 1.3; flex: 1;
    }
    .fileGridDelBtn {
      background: rgba(248,113,113,.85); border: none; border-radius: 8px;
      color: #fff; font-size: 14px; width: 28px; height: 28px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: .15s; margin-left: 6px;
    }
    .fileGridDelBtn:hover { background: #f87171; transform: scale(1.1); }

    /* ── FILE SECTION ── */
    #filesSection { margin-top: 20px; }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 14px; }
    .emptyIcon { font-size: 36px; margin-bottom: 10px; }

    /* ── TOP BAR ── */
    .topBarRow {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .topBarRow h2 {
      font-family: "Playfair Display", serif; color: var(--pink); font-size: 24px;
    }

    /* ── ALERT ── */
    .alert {
      padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
      margin-top: 8px;
    }
    .alert.error { background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.25); }
    .alert.success { background: rgba(110,231,183,.1); color: var(--green); border: 1px solid rgba(110,231,183,.25); }

    /* ── CREATE FOLDER FORM ── */
    .createFolderBox {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    .createFolderBox h4 {
      font-family: "Playfair Display", serif; color: var(--pink);
      font-size: 15px; margin-bottom: 12px;
    }
    .createFolderRow { display: flex; gap: 10px; flex-wrap: wrap; }
    .createFolderRow input { flex: 1; min-width: 180px; }

    /* ── STATUS MSG ── */
    .statusMsg { font-size: 13px; min-height: 18px; margin-top: 8px; }
    .statusMsg.success { color: var(--green); }
    .statusMsg.error { color: var(--red); }

    /* ── PER-FOLDER TOGGLE ── */
    .folderToggleWrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .folderToggleSmall {
      width: 44px; height: 24px;
      position: relative; border-radius: 999px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      cursor: pointer; transition: background .3s ease, border-color .3s ease;
      flex-shrink: 0; display: inline-block;
    }
    .folderToggleSmall.on { background: linear-gradient(135deg, var(--green), #34d399); border-color: transparent; }
    .folderToggleSmall::after {
      content: ''; position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%; background: #fff;
      transition: left .3s ease; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .folderToggleSmall.on::after { left: 22px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1c1d30; border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px; padding: 10px 22px;
      font-size: 13px; font-weight: 600; color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      opacity: 0; transition: opacity .2s, transform .2s;
      z-index: 9999; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(110,231,183,.3); }
    .toast.error { border-color: rgba(248,113,113,.3); }

    /* ── CONFIRM MODAL ── */
    .modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
    }
    .modal.open { display: flex; }
    .modalBox {
      background: linear-gradient(180deg, #181929, #12132a);
      border: 1px solid rgba(255,182,193,.2);
      border-radius: 22px; padding: 28px; width: 90%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    .modalBox h4 { font-family: "Playfair Display", serif; color: var(--pink); font-size: 18px; margin-bottom: 10px; }
    .modalBox p { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .modalActions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    @media (max-width: 640px) {
      .statsRow { grid-template-columns: 1fr 1fr; }
      .adminWrap { padding: 16px 14px 40px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="siteHeader">
    <div class="headerWrap">
      <div class="logoBlock">
        <div class="logoTitle">Admin Panel</div>
        <div class="logoSub">QUOTES NRY</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <a href="quotes.html" class="pill" target="_blank" id="publicLink" style="display:none;">🔗 Lihat Publik</a>
        <button class="pill danger" id="logoutBtn" style="display:none;">Logout</button>
      </div>
    </div>
  </header>

  <div class="adminWrap">

    <!-- LOGIN -->
    <div id="loginSection" class="card" style="max-width:420px;margin:80px auto;">
      <h2 style="font-family:'Playfair Display',serif;color:var(--pink);font-size:28px;margin-bottom:6px;">Admin Login</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:20px;">Masuk dengan akun admin kamu</p>
      <div class="formRow">
        <input id="emailInput" type="email" placeholder="Email admin" />
        <input id="passInput" type="password" placeholder="Password" />
        <button class="btn primary" id="loginBtn">Login</button>
        <div class="statusMsg" id="loginStatus"></div>
      </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none;">

      <!-- TOP BAR -->
      <div class="topBarRow">
        <div>
          <h2>Admin Panel</h2>
          <p style="color:var(--muted);font-size:13px;margin-top:4px;">Kelola folder & file Quotes NRY</p>
        </div>
      </div>

      <!-- STATS -->
      <div class="statsRow" id="statsRow">
        <div class="statCard">
          <div class="statNum" id="statFolders">—</div>
          <div class="statLabel">TOTAL FOLDER</div>
        </div>
        <div class="statCard">
          <div class="statNum" id="statFiles">—</div>
          <div class="statLabel">TOTAL FILE</div>
        </div>
        <div class="statCard">
          <div class="statNum" id="statEnabled">—</div>
          <div class="statLabel">FOLDER AKTIF UPLOAD</div>
        </div>
      </div>

      <!-- MAIN GRID -->
      <div class="adminGrid">

        <!-- LEFT: Upload Toggle + Create Folder -->
        <div style="display:flex;flex-direction:column;gap:18px;">

          <!-- Create Folder -->
          <div class="adminSection">
            <div class="adminSectionHead">
              <h3>Buat Folder Baru</h3>
            </div>
            <div class="adminSectionBody">
              <div class="createFolderRow">
                <input id="folderNameInput" placeholder="Nama folder (misal: quotes senin, 4 mei 2026)" />
                <button class="btn primary" id="createFolderBtn">+ Buat</button>
              </div>
              <div class="statusMsg" id="folderStatus"></div>
            </div>
          </div>

        </div>

        <!-- RIGHT: Folder List -->
        <div class="adminSection">
          <div class="adminSectionHead">
            <h3>📂 Daftar Folder</h3>
            <button class="btn" id="refreshBtn">🔄 Refresh</button>
          </div>
          <div class="adminSectionBody" style="flex:1;">
            <div class="scrollBox" id="folderList">
              <div class="empty"><div class="emptyIcon">🗂️</div>Memuat folder...</div>
            </div>
          </div>
        </div>

      </div><!-- /adminGrid -->

      <!-- FILE VIEWER SECTION -->
      <div class="adminSection" id="filesSection" style="display:none;margin-top:20px;">
        <div class="adminSectionHead">
          <div>
            <h3 id="filesSectionTitle">File di Folder</h3>
            <div style="color:var(--muted);font-size:12px;margin-top:2px;" id="filesSectionMeta"></div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn danger" id="deleteFolderFromViewer">🗑 Hapus Folder</button>
            <button class="btn" id="closeFilesSection">✕ Tutup</button>
          </div>
        </div>
        <div class="adminSectionBody">
          <div class="scrollBox" style="height:420px;">
            <div class="fileGrid" id="adminFileGrid"></div>
          </div>
        </div>
      </div>

    </div><!-- /adminPanel -->
  </div><!-- /adminWrap -->

  <!-- CONFIRM MODAL -->
  <div class="modal" id="confirmModal">
    <div class="modalBox">
      <h4 id="confirmTitle">Konfirmasi</h4>
      <p id="confirmMsg">Apakah kamu yakin?</p>
      <div class="modalActions">
        <button class="btn" id="confirmCancel">Batal</button>
        <button class="btn danger" id="confirmOk">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const BUCKET = "quotes-files";

    // ── STATE ──
    let currentFolderId = null;
    let currentFolderName = null;
    let folderCount = 0;
    let fileCount = 0;
    let enabledCount = 0;

    // ── TOAST ──
    let toastTimer;
    function showToast(msg, type = "") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = "toast", 3000);
    }

    function setStatus(el, msg, type = "") {
      el.textContent = msg;
      el.className = "statusMsg " + type;
    }

    function esc(s = "") {
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
    }

    // ── CONFIRM MODAL ──
    function openConfirm(title, msg) {
      return new Promise(resolve => {
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = msg;
        document.getElementById("confirmModal").classList.add("open");
        const ok = document.getElementById("confirmOk");
        const cancel = document.getElementById("confirmCancel");
        function cleanup(val) {
          document.getElementById("confirmModal").classList.remove("open");
          ok.removeEventListener("click", onOk);
          cancel.removeEventListener("click", onCancel);
          resolve(val);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        ok.addEventListener("click", onOk);
        cancel.addEventListener("click", onCancel);
      });
    }

    document.getElementById("confirmModal").addEventListener("click", e => {
      if (e.target === document.getElementById("confirmModal")) {
        document.getElementById("confirmModal").classList.remove("open");
      }
    });

    // ── AUTH ──
    async function verifyAdmin() {
      const { data: sess } = await supabase.auth.getSession();
      if (!sess?.session) return false;
      const email = sess.session.user?.email;
      const { data } = await supabase.from("admins").select("email").eq("email", email).maybeSingle();
      if (!data) { await supabase.auth.signOut(); return false; }
      return true;
    }

    function showLogin(msg = "", type = "") {
      document.getElementById("loginSection").style.display = "";
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("logoutBtn").style.display = "none";
      document.getElementById("publicLink").style.display = "none";
      const s = document.getElementById("loginStatus");
      setStatus(s, msg, type);
    }

    function showPanel() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("adminPanel").style.display = "";
      document.getElementById("logoutBtn").style.display = "";
      document.getElementById("publicLink").style.display = "";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const pass  = document.getElementById("passInput").value;
      const s = document.getElementById("loginStatus");
      if (!email || !pass) { setStatus(s, "Email & password wajib diisi.", "error"); return; }
      document.getElementById("loginBtn").disabled = true;
      setStatus(s, "Login...");
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      document.getElementById("loginBtn").disabled = false;
      if (error || !data?.session) { setStatus(s, "Login gagal: " + (error?.message || "unknown"), "error"); return; }
      const ok = await verifyAdmin();
      if (!ok) { setStatus(s, "Akun ini bukan admin.", "error"); return; }
      showPanel();
      await initPanel();
    });

    document.getElementById("passInput").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    // ── STATS ──
    function renderStats() {
      document.getElementById("statFolders").textContent = folderCount;
      document.getElementById("statFiles").textContent   = fileCount > 0 ? fileCount : "—";
      document.getElementById("statEnabled").textContent = enabledCount + "/" + folderCount;
    }

    // ── FOLDERS ──
    async function loadFolders() {
      const list = document.getElementById("folderList");
      list.innerHTML = `<div class="empty"><div class="emptyIcon">⏳</div>Memuat folder...</div>`;

      const { data, error } = await supabase.from("quotes_folders").select("*").order("name");
      if (error) {
        list.innerHTML = `<div class="empty" style="color:var(--red);">Gagal: ${esc(error.message)}</div>`;
        return;
      }
      const folders = data || [];
      folderCount = folders.length;
      enabledCount = folders.filter(f => f.upload_enabled !== false).length;
      renderStats();

      if (!folders.length) {
        list.innerHTML = `<div class="empty"><div class="emptyIcon">🗂️</div>Belum ada folder. Buat folder pertamamu!</div>`;
        return;
      }

      list.innerHTML = "";
      folders.forEach(f => {
        const isEnabled = f.upload_enabled !== false;
        const item = document.createElement("div");
        item.className = "folderItem";
        item.innerHTML = `
          <div class="folderItemTop">
            <div class="folderIcon">🗂️</div>
            <div style="flex:1;min-width:0;">
              <div class="folderName">${esc(f.name)}</div>
              <div class="folderMeta">${fmtDate(f.created_at)}</div>
            </div>
          </div>
          <div class="folderActions">
            <div class="folderToggleWrap" title="Toggle izin upload publik">
              <div class="folderToggleSmall ${isEnabled ? 'on' : ''}" data-toggle-folder="${esc(f.id)}"></div>
              <span class="badge ${isEnabled ? 'enabled' : 'disabled'}" data-toggle-badge="${esc(f.id)}">${isEnabled ? 'UPLOAD ON' : 'UPLOAD OFF'}</span>
            </div>
            <button class="btn success" style="font-size:12px;padding:7px 13px;" data-browse="${esc(f.id)}" data-bname="${esc(f.name)}">📂 Browse</button>
            <button class="btn danger"  style="font-size:12px;padding:7px 13px;" data-del-folder="${esc(f.id)}" data-dname="${esc(f.name)}">🗑 Hapus</button>
          </div>
        `;
        list.appendChild(item);
      });

      // bind toggle per folder
      list.querySelectorAll("[data-toggle-folder]").forEach(tog => {
        tog.addEventListener("click", async () => {
          const folderId = tog.dataset.toggleFolder;
          const isOn = tog.classList.contains("on");
          const newVal = !isOn;
          tog.classList.toggle("on", newVal);
          const badge = list.querySelector(`[data-toggle-badge="${folderId}"]`);
          if (badge) {
            badge.textContent = newVal ? "UPLOAD ON" : "UPLOAD OFF";
            badge.className = "badge " + (newVal ? "enabled" : "disabled");
          }
          enabledCount += newVal ? 1 : -1;
          renderStats();
          const { error } = await supabase.from("quotes_folders").update({ upload_enabled: newVal }).eq("id", folderId);
          if (error) {
            showToast("Gagal simpan: " + error.message, "error");
            // revert
            tog.classList.toggle("on", isOn);
            if (badge) { badge.textContent = isOn ? "UPLOAD ON" : "UPLOAD OFF"; badge.className = "badge " + (isOn ? "enabled" : "disabled"); }
            enabledCount += isOn ? 1 : -1;
            renderStats();
          } else {
            showToast(newVal ? "Upload folder diaktifkan ✓" : "Upload folder dinonaktifkan 🔒", newVal ? "success" : "");
          }
        });
      });

      list.querySelectorAll("[data-browse]").forEach(btn => {
        btn.addEventListener("click", () => loadAdminFiles(btn.dataset.browse, btn.dataset.bname));
      });

      list.querySelectorAll("[data-del-folder]").forEach(btn => {
        btn.addEventListener("click", () => deleteFolder(btn.dataset.delFolder, btn.dataset.dname));
      });
    }

    // ── CREATE FOLDER ──
    document.getElementById("createFolderBtn").addEventListener("click", async () => {
      const name = document.getElementById("folderNameInput").value.trim();
      const s = document.getElementById("folderStatus");
      if (!name) { setStatus(s, "Nama folder wajib diisi.", "error"); return; }
      document.getElementById("createFolderBtn").disabled = true;
      setStatus(s, "Membuat folder...");
      const { error } = await supabase.from("quotes_folders").insert({ name });
      document.getElementById("createFolderBtn").disabled = false;
      if (error) { setStatus(s, "Gagal: " + error.message, "error"); return; }
      setStatus(s, `Folder "${name}" berhasil dibuat ✓`, "success");
      document.getElementById("folderNameInput").value = "";
      showToast(`Folder "${name}" dibuat! ✓`, "success");
      setTimeout(() => setStatus(s, ""), 3000);
      await loadFolders();
    });

    document.getElementById("folderNameInput").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("createFolderBtn").click();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadFolders);

    // ── DELETE FOLDER ──
    async function deleteFolder(folderId, folderName) {
      const confirmed = await openConfirm(
        "Hapus Folder",
        `Hapus folder "${folderName}" beserta semua file di dalamnya? Tindakan ini tidak bisa dibatalkan.`
      );
      if (!confirmed) return;

      // List all files in bucket folder first
      const { data: bFiles } = await supabase.storage.from(BUCKET).list(folderId + "/");
      if (bFiles && bFiles.length) {
        const paths = bFiles.filter(f => f.name !== ".keep" && f.id).map(f => `${folderId}/${f.name}`);
        if (paths.length) await supabase.storage.from(BUCKET).remove(paths);
      }

      // Delete DB record
      const { error } = await supabase.from("quotes_folders").delete().eq("id", folderId);
      if (error) { showToast("Gagal hapus folder: " + error.message, "error"); return; }

      showToast(`Folder "${folderName}" dihapus ✓`, "success");
      await loadFolders();

      // Close file viewer if it was showing this folder
      if (currentFolderId === folderId) {
        document.getElementById("filesSection").style.display = "none";
        currentFolderId = null;
        currentFolderName = null;
      }
    }

    // ── BROWSE FILES ──
    async function loadAdminFiles(folderId, folderName) {
      currentFolderId = folderId;
      currentFolderName = folderName;

      const sec = document.getElementById("filesSection");
      sec.style.display = "";
      document.getElementById("filesSectionTitle").textContent = `📂 ${folderName}`;
      document.getElementById("filesSectionMeta").textContent = "Memuat...";
      document.getElementById("adminFileGrid").innerHTML = "";
      sec.scrollIntoView({ behavior: "smooth", block: "start" });

      const { data, error } = await supabase.storage.from(BUCKET).list(folderId + "/", {
        sortBy: { column: "created_at", order: "desc" }
      });
      if (error) {
        document.getElementById("adminFileGrid").innerHTML = `<div style="color:var(--red);grid-column:1/-1;padding:20px;">Gagal: ${esc(error.message)}</div>`;
        return;
      }

      const files = (data || []).filter(f => f.name !== ".keep" && f.id);
      fileCount = files.length;
      document.getElementById("filesSectionMeta").textContent = `${files.length} foto`;
      renderStats();

      const grid = document.getElementById("adminFileGrid");

      if (!files.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">Belum ada foto di folder ini.</div>`;
        return;
      }

      grid.innerHTML = "";
      files.forEach(f => {
        const { data: ud } = supabase.storage.from(BUCKET).getPublicUrl(`${folderId}/${f.name}`);
        const item = document.createElement("div");
        item.className = "fileGridItem";
        item.innerHTML = `
          <img src="${esc(ud.publicUrl)}" loading="lazy" alt="${esc(f.name)}" />
          <div class="fileGridItemOverlay">
            <span class="fileGridItemName">${esc(f.name)}</span>
            <button class="fileGridDelBtn" title="Hapus file" data-file="${esc(f.name)}">🗑</button>
          </div>
        `;
        grid.appendChild(item);

        item.querySelector("[data-file]").addEventListener("click", async (e) => {
          e.stopPropagation();
          const fileName = f.name;
          const confirmed = await openConfirm("Hapus File", `Hapus foto "${fileName}"? Tindakan ini tidak bisa dibatalkan.`);
          if (!confirmed) return;

          const path = `${folderId}/${fileName}`;
          const { error: delErr } = await supabase.storage.from(BUCKET).remove([path]);
          if (delErr) { showToast("Gagal hapus file: " + delErr.message, "error"); return; }

          showToast(`File "${fileName}" dihapus ✓`, "success");
          item.remove();
          fileCount = Math.max(0, fileCount - 1);
          document.getElementById("filesSectionMeta").textContent = `${fileCount} foto`;
          renderStats();

          if (fileCount === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">Belum ada foto di folder ini.</div>`;
          }
        });
      });
    }

    // ── CLOSE FILES SECTION ──
    document.getElementById("closeFilesSection").addEventListener("click", () => {
      document.getElementById("filesSection").style.display = "none";
      currentFolderId = null;
      currentFolderName = null;
      fileCount = 0;
      renderStats();
    });

    // ── DELETE FOLDER FROM VIEWER ──
    document.getElementById("deleteFolderFromViewer").addEventListener("click", () => {
      if (!currentFolderId) return;
      deleteFolder(currentFolderId, currentFolderName);
    });

    // ── INIT ──
    async function initPanel() {
      await loadFolders();
    }

    (async () => {
      const ok = await verifyAdmin();
      if (ok) { showPanel(); await initPanel(); }
      else showLogin();
    })();
  </script>
</body>
</html>
