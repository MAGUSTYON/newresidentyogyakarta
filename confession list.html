<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confession Board 💌 • New Resident Yogyakarta</title>
  <meta name="description" content="Baca semua confession yang sudah dikirim di komunitas New Resident Yogyakarta." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0b0c14;
      --bg-1: #12132a;
      --pink: #f2a1b3;
      --pink-2: #d47aa0;
      --text: #ececf3;
      --muted: #a7a7c0;
      --border: rgba(255,182,193,.18);
      --border-2: rgba(255,255,255,.14);
      --shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; font-family: "Inter", sans-serif; color: var(--text);
      background:
        radial-gradient(1100px 520px at 12% -12%, rgba(242,161,179,.09), transparent 42%),
        radial-gradient(900px 520px at 88% 112%, rgba(242,161,179,.06), transparent 44%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-0) 100%);
      background-attachment: fixed;
    }

    /* ===== HEADER — sama persis quotes.html ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 3000;
      background: rgba(7,6,17,.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.14);
    }
    .headerInner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { display:flex; flex-direction:column; gap:2px; }
    .brand b {
      font-family: Pacifico, cursive;
      font-weight: 400;
      font-size: 20px;
      color: var(--pink);
      line-height: 1;
    }
    .brand small {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .nav { display:flex; gap:6px; flex-wrap:wrap; }
    .nav a {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      transition: all .15s ease;
    }
    .nav a:hover { color:#fff; background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14); }
    .nav a.active {
      color: #0b0a12;
      background: linear-gradient(180deg, #f2a3c7, #d98ab7);
      border-color: rgba(255,255,255,.18);
      font-weight: 700;
    }

    /* ===== PAGE ===== */
    .pageWrap { max-width: 680px; margin: 0 auto; padding: 28px 18px 60px; }

    .pageHero { text-align: center; margin-bottom: 28px; }
    .pageHero h1 {
      font-family: "Playfair Display", serif; font-style: italic;
      font-size: 32px; color: var(--pink); margin-bottom: 8px;
    }
    .pageHero p { font-size: 14px; color: var(--muted); line-height: 1.65; }

    /* SEARCH */
    .searchWrap { position: relative; margin-bottom: 14px; }
    .searchInput {
      width: 100%; background: rgba(255,255,255,.06);
      border: 1px solid var(--border-2); border-radius: 14px;
      padding: 12px 16px 12px 40px; color: var(--text); outline: none;
      font-size: 14px; font-family: inherit; transition: .2s;
    }
    .searchInput::placeholder { color: rgba(167,167,192,.6); }
    .searchInput:focus { border-color: rgba(242,161,179,.45); background: rgba(255,255,255,.08); }
    .searchIcon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 15px; pointer-events: none; opacity: .5;
    }

    /* COUNT */
    .countRow { font-size: 12px; color: var(--muted); margin-bottom: 16px; font-weight: 600; }

    /* CONFESSION LIST */
    .confessionList { display: flex; flex-direction: column; gap: 12px; }

    .confCard {
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px; padding: 18px 20px;
      cursor: pointer; transition: .2s;
    }
    .confCard:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(242,161,179,.25);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0,0,0,.3);
    }
    .confCardTo { font-weight: 800; font-size: 15px; color: var(--pink); margin-bottom: 3px; }
    .confCardFrom { font-size: 12px; color: var(--muted); }
    .confCardSong { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .confCardSong span { color: rgba(255,255,255,.75); }
    .confCardMessage {
      font-size: 13.5px; color: rgba(255,255,255,.85); line-height: 1.65;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      margin: 10px 0 10px;
    }
    .confCardDate { font-size: 11px; color: var(--muted); }

    /* EMPTY */
    .empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
    .emptyIcon { font-size: 40px; margin-bottom: 12px; }

    /* LOADING */
    .loadingDots { display: flex; justify-content: center; gap: 6px; padding: 40px 0; }
    .loadingDots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--pink); opacity: .3;
      animation: dotPulse 1.2s ease-in-out infinite;
    }
    .loadingDots span:nth-child(2) { animation-delay: .2s; }
    .loadingDots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotPulse { 0%,100%{opacity:.2;transform:scale(.8);}50%{opacity:1;transform:scale(1);} }

    /* MODAL */
    .modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.75); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.open { display: flex; }
    .modalBox {
      background: linear-gradient(180deg, #181929, #12132a);
      border: 1px solid rgba(255,182,193,.2);
      border-radius: 24px; padding: 28px; width: 100%; max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto;
      position: relative;
    }
    .modalClose {
      position: absolute; top: 18px; right: 18px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      color: var(--muted); font-size: 16px; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; transition: .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .modalClose:hover { background: rgba(255,255,255,.14); color: var(--text); }
    .modalTitle {
      font-family: "Playfair Display", serif; font-style: italic;
      font-size: 24px; color: var(--pink); margin-bottom: 4px;
    }
    .modalDate { font-size: 11px; color: var(--muted); margin-bottom: 20px; }
    .modalLabel { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .modalValue { font-size: 15px; color: var(--text); margin-bottom: 16px; line-height: 1.7; }
    .modalValue.message {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 14px; font-size: 14px; line-height: 1.75;
    }

    /* CTA */
    .ctaBar {
      background: rgba(242,161,179,.07); border: 1px solid rgba(242,161,179,.18);
      border-radius: 20px; padding: 20px 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap; margin-top: 28px;
    }
    .ctaBar p { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .ctaBar p strong { color: var(--text); }
    .ctaBtn {
      text-decoration: none; font-weight: 700; font-size: 13px;
      padding: 9px 18px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, var(--pink), var(--pink-2));
      color: #1b0b12; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(242,161,179,.3);
      transition: .2s;
    }
    .ctaBtn:hover { box-shadow: 0 6px 22px rgba(242,161,179,.45); transform: translateY(-1px); }

    @media (max-width: 480px) {
      .pageHero h1 { font-size: 26px; }
      .ctaBar { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="headerInner">
      <div class="brand">
        <b>New Resident</b>
        <small>Yogyakarta</small>
      </div>
      <nav class="nav">
        <a href="index.html">Beranda</a>
        <a href="quotes.html">Quotes</a>
        <a href="rating.html">Rating</a>
        <a class="active" href="confession.html">Confession</a>
      </nav>
    </div>
  </header>

  <div class="pageWrap">

    <div class="pageHero">
      <h1>Confession Board 💌</h1>
      <p>Semua pesan yang sudah dikirim oleh komunitas NRY.</p>
    </div>

    <div class="searchWrap">
      <span class="searchIcon">🔍</span>
      <input class="searchInput" id="searchInput" type="text" placeholder="Cari nama, pesan, atau lagu..." />
    </div>

    <div class="countRow" id="countRow">Memuat...</div>

    <div class="confessionList" id="confessionList">
      <div class="loadingDots"><span></span><span></span><span></span></div>
    </div>

    <div class="ctaBar">
      <p><strong>Mau kirim confession?</strong><br>Boleh anonim, dijamin aman 🌸</p>
      <a href="confession.html" class="ctaBtn">✉ Kirim Sekarang</a>
    </div>

  </div>

  <!-- MODAL -->
  <div class="modal" id="detailModal">
    <div class="modalBox">
      <button class="modalClose" id="modalClose">✕</button>
      <div class="modalTitle" id="modalTitle">Confession</div>
      <div class="modalDate" id="modalDate"></div>

      <div class="modalLabel">To</div>
      <div class="modalValue" id="modalTo">—</div>

      <div class="modalLabel">From</div>
      <div class="modalValue" id="modalFrom">—</div>

      <div id="modalSongWrap">
        <div class="modalLabel">Song</div>
        <div class="modalValue" id="modalSong">—</div>
      </div>

      <div class="modalLabel">Pesan</div>
      <div class="modalValue message" id="modalMessage">—</div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    let allConfessions = [];
    let searchQuery = "";

    async function loadConfessions() {
      const { data, error } = await supabase
        .from("confessions_nry")
        .select("id, to_name, from_name, song, message, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("confessionList").innerHTML =
          `<div class="empty"><div class="emptyIcon">😢</div>Gagal memuat: ${escHtml(error.message)}</div>`;
        return;
      }
      allConfessions = data || [];
      renderList();
    }

    function renderList() {
      const list = document.getElementById("confessionList");
      let filtered = allConfessions;

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(c =>
          (c.to_name || "").toLowerCase().includes(q) ||
          (c.from_name || "").toLowerCase().includes(q) ||
          (c.message || "").toLowerCase().includes(q) ||
          (c.song || "").toLowerCase().includes(q)
        );
      }

      document.getElementById("countRow").textContent = `${filtered.length} confession`;

      if (!filtered.length) {
        list.innerHTML = `<div class="empty"><div class="emptyIcon">💌</div>${searchQuery ? "Tidak ada hasil untuk pencarian ini." : "Belum ada confession di sini."}</div>`;
        return;
      }

      list.innerHTML = "";
      filtered.forEach(c => {
        const card = document.createElement("div");
        card.className = "confCard";
        card.innerHTML = `
          <div class="confCardTo">To: ${escHtml(c.to_name)}</div>
          <div class="confCardFrom">From: ${c.from_name ? escHtml(c.from_name) : '<span style="color:var(--muted)">Anonim</span>'}</div>
          ${c.song ? `<div class="confCardSong">🎵 <span>${escHtml(c.song)}</span></div>` : ""}
          <div class="confCardMessage">${escHtml(c.message)}</div>
          <div class="confCardDate">${fmtDate(c.created_at)}</div>
        `;
        card.addEventListener("click", () => openModal(c));
        list.appendChild(card);
      });
    }

    function openModal(c) {
      document.getElementById("modalTitle").textContent = `To: ${c.to_name}`;
      document.getElementById("modalDate").textContent = fmtDate(c.created_at);
      document.getElementById("modalTo").textContent = c.to_name || "—";
      document.getElementById("modalFrom").textContent = c.from_name || "Anonim";
      document.getElementById("modalMessage").textContent = c.message || "—";
      const songWrap = document.getElementById("modalSongWrap");
      if (c.song) { songWrap.style.display = ""; document.getElementById("modalSong").textContent = c.song; }
      else { songWrap.style.display = "none"; }
      document.getElementById("detailModal").classList.add("open");
    }

    document.getElementById("modalClose").addEventListener("click", () => {
      document.getElementById("detailModal").classList.remove("open");
    });
    document.getElementById("detailModal").addEventListener("click", e => {
      if (e.target === document.getElementById("detailModal"))
        document.getElementById("detailModal").classList.remove("open");
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      renderList();
    });

    function escHtml(s = "") {
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }
    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
    }

    loadConfessions();
  </script>
</body>
</html>
